apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: transcoder

resources:
  - ../../base
  - worker-cpu.yaml
  - web-frontend.yaml
  - web-ingress.yaml
  - web-rbac.yaml

patches:
  - path: master-patch.yaml
    target:
      kind: StatefulSet
      name: transcoder-node
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: transcoder-config

images:
  - name: transcoder-node
    newName: iad.ocir.io/idr5qsmifndm/transcoder-node
    newTag: "v0.1.10"
  - name: transcoder-web
    newName: iad.ocir.io/idr5qsmifndm/transcoder-web
    newTag: "v0.1.15"
