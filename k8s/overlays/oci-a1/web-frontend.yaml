# Web UI — deployed as a 4th "role" alongside the master + cpu-worker pods.
# Runs on OKE Virtual Nodes (Pod.Standard.A1.Flex, serverless, billed per
# pod). Must stay schedulable with zero cpu-worker pods running — Start/Stop
# Workers scales cpu-worker (and the underlying virtual-node-pool) down to
# just the master+web baseline when idle, so a *required* podAffinity on a
# cpu-worker pod (as this used to have) would strand web in Pending forever
# whenever it needs to reschedule while workers are stopped. No affinity at
# all — conceptual grouping isn't worth that outage risk.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcoder-web
  labels:
    app.kubernetes.io/name: transcoder-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: transcoder-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transcoder-web
    spec:
      serviceAccountName: transcoder-web
      imagePullSecrets:
        - name: ocir-secret
      containers:
        - name: transcoder-web
          image: transcoder-web:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            # Start/Stop Workers targets the worker Deployment directly —
            # separate from the transcoder-node master StatefulSet on this
            # overlay, so it's safe to scale all the way to 0.
            - name: K8S_WORKER_KIND
              value: "deployments"
            - name: K8S_WORKER_NAME
              value: "transcoder-worker-cpu"
            # In-cluster master Service — defaults the UI's cluster target so
            # users don't have to type a ?master= address.
            - name: CLUSTER_MASTER
              value: "transcoder-master.transcoder.svc.cluster.local:9900"
            # Same object store the cluster nodes use. Cluster-mode job
            # submission uploads the raw source video here first — the
            # master pod has no other way to reach a file that only exists
            # on this pod's local disk.
            - name: OBJECT_STORE_URL
              valueFrom:
                configMapKeyRef:
                  name: transcoder-config
                  key: object-store-url
            - name: OBJECT_STORE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: transcoder-config
                  key: object-store-bucket
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: oci-s3-credentials
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: oci-s3-credentials
                  key: secret-access-key
            - name: AWS_REGION
              value: "us-ashburn-1"
            # Least-privilege OCI API identity (transcoder-web-scaler, IAM
            # policy scoped to `manage cluster-virtualnode-pools` on this one
            # pool OCID only via `where target.virtualnodepool.id = ...` —
            # see oci-scaler-credentials Secret) so Start/Stop Workers can
            # resize the virtual-node-pool itself, not just the k8s
            # Deployment. Without this, stopping workers leaves idle (billed)
            # OKE virtual nodes behind — scaling the Deployment to 0 doesn't
            # shrink the pool it was provisioned from.
            - name: OCI_TENANCY_ID
              valueFrom:
                secretKeyRef:
                  name: oci-scaler-credentials
                  key: tenancy-id
            - name: OCI_USER_ID
              valueFrom:
                secretKeyRef:
                  name: oci-scaler-credentials
                  key: user-id
            - name: OCI_FINGERPRINT
              valueFrom:
                secretKeyRef:
                  name: oci-scaler-credentials
                  key: fingerprint
            - name: OCI_REGION
              valueFrom:
                secretKeyRef:
                  name: oci-scaler-credentials
                  key: region
            - name: OCI_VIRTUAL_NODE_POOL_ID
              valueFrom:
                secretKeyRef:
                  name: oci-scaler-credentials
                  key: virtual-node-pool-id
            # Authentication. The server refuses to start without
            # TRANSCODER_API_KEY, so this Secret must exist before the
            # rollout. Create it out of band; never commit the values:
            #   kubectl -n transcoder create secret generic transcoder-web-auth \
            #     --from-literal=api-key=$(openssl rand -hex 32) \
            #     --from-literal=admin-key=$(openssl rand -hex 32)
            - name: TRANSCODER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: transcoder-web-auth
                  key: api-key
            - name: TRANSCODER_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: transcoder-web-auth
                  key: admin-key
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # Probes target the API, not the static index page: serving HTML says
          # nothing about whether the object store is reachable or the disk is
          # full. Both paths are exempt from key auth because kubelet cannot
          # send headers.
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          # Virtual nodes require requests == limits (fixed pod-shape
          # allocation, no bursting).
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: oci-scaler-key
              mountPath: /var/run/secrets/oci-scaler
              readOnly: true
      volumes:
        - name: oci-scaler-key
          secret:
            secretName: oci-scaler-credentials
            items:
              - key: private-key
                path: private-key
---
# ClusterIP only — external exposure is via the Native Ingress Controller
# (web-ingress.yaml), since type:LoadBalancer registers an unreachable
# NodePort backend against OKE Virtual Nodes (see web-ingress.yaml comment).
apiVersion: v1
kind: Service
metadata:
  name: transcoder-web
  labels:
    app.kubernetes.io/name: transcoder-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: transcoder-web
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
