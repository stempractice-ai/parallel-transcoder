# VALIDATION FIXTURE. Do not apply to pt1-cluster while it runs OKE virtual
# nodes. Renders oci-a1 plus the managed-node hardening so the policy test can
# prove each NetworkPolicy selects real pods on real ports. It is also the
# shape to adopt if the cluster moves to managed nodes (OKE audit Option 3).
# Before enabling for real, confirm kubelet probes still pass under
# default-deny on the target CNI.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: transcoder
resources:
  - ../../overlays/oci-a1
components:
  - ../../components/managed-node-hardening
